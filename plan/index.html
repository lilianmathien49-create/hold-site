<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hold — Ton plan de course</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F3F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="plan.css">
</head>
<body>

<header class="nav" id="nav">
  <a href="../" class="logo" aria-label="Hold, retour au site">Hold<span class="logo-dot" aria-hidden="true"></span></a>
  <div class="nav-r">
    <p class="eyebrow" id="navWho">Plan de course</p>
  </div>
</header>

<main class="pl">

  <!-- La porte : tant que le mot de passe n'est pas bon, rien n'est déchiffré -->
  <section class="gate" id="gate">
    <form class="gate-box" id="gateForm">
      <p class="eyebrow">Ton espace</p>
      <h1 class="title">Ton plan<br><span class="soft">de course.</span></h1>
      <p class="sub" id="gateFor">Entre le code que ton coach t'a transmis.</p>

      <!-- Un seul champ quand on arrive sans lien : le code contient l'identifiant
           du plan et le mot de passe, séparés par le premier tiret. -->
      <label class="f" id="codeWrap">
        <span>Ton code</span>
        <input id="code" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
               autocomplete="off" placeholder="a7f3c921-arete-allure-105">
      </label>

      <!-- Quand on arrive par le lien direct, l'identifiant est déjà connu :
           on ne demande plus que le mot de passe. -->
      <label class="f" id="pwWrap" hidden>
        <span>Mot de passe</span>
        <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      </label>

      <label class="remember">
        <input type="checkbox" id="remember">
        <span>Rester connecté sur cet appareil</span>
      </label>

      <button type="submit" class="btn" id="gateBtn">Ouvrir mon plan</button>
      <p class="hint" id="gateMsg" role="status" aria-live="polite"></p>
      <p class="hint gate-help">Tu as perdu ton code&nbsp;?
        <a href="mailto:lilian.mathien49@gmail.com?subject=Code%20d%27acc%C3%A8s%20Hold">Demande-le</a>.</p>
    </form>

    <p class="gate-demo">Pas encore de code&nbsp;?
      <a href="#apercu-arete-cadence-seuil-204">Ouvre le plan de démonstration</a>
      — un vrai plan, de bout en bout.</p>
  </section>

  <div id="planRoot" hidden></div>

</main>

<script type="module" src="plan.js"></script>
</body>
</html>
